text_to_speech_agent:
  agent_id: text_to_speech_agent
  description: An agent that converts text to speech.
  llm_config:
    model_name: gemini-2.5-flash-native-audio-preview-12-2025
    neutral:
      voice_name: Autonoe # See here for more voices : https://ai.google.dev/gemini-api/docs/speech-generation#voices
      system_message: 
        'You are a text to speech agent that converts text to speech in a neutral tone. 
        You must only say the text that is here, do not change any words, only tone.
        Here is the text to convert: {0}'
    sassy:
      voice_name: Laomedeia # See here for more voices : https://ai.google.dev/gemini-api/docs/speech-generation#voices
      system_message:
        'You are a text to speech agent that converts text to speech in a sassy tone. 
        You must only say the text that is here, do not change any words, only tone.
        Here is the text to convert: {0}'
    scottish:
